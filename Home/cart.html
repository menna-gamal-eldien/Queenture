<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queenture</title>

    <link rel="stylesheet" href="../Style/style.css">
    <link rel="stylesheet" href="../Style/cart.css">
    <link rel="icon" href="../Web_logo_bright.png">

</head>

<body>
    <div class="Bigcontainer">
        <div class="body R C">
            <div class="container">
                <div class="location"></div>
                <div class="content R Col">
                    <div class="table">
                        <div class="title">
                            <span>Product</span>
                            <span>Price</span>
                            <span>Quantity</span>
                            <span>Color</span>
                            <span>Subtotal</span>
                        </div>
                        <div class="buttons R">
                            <button><a href="./store.html" class="remove">Return to shop</a></button>
                            <button>Update Cart</button>
                        </div>
                    </div>
                    <div class="bill R Col">
                        <div class="title">Cart Total</div>
                        <div class="subtotal R">
                            <div>Subtotal:</div>
                            <span>####</span>
                        </div>
                        <div class="shipping R">
                            <div>Shipping:</div>
                            <span>####</span>
                        </div>
                        <div class="total R">
                            <div>Total:</div>
                            <span>####</span>
                        </div>
                        <button><a href="./cart/checkout.html" class="remove">Proceed to checkout</a></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../Script/JS/StateAuch.js"></script>
    <script src="../Script/JS/DB.js"></script>
    <script src="../Script/JS/layout.js"></script>
    <script src="../Script/JS/cart.js"></script>
</body>

</html>
