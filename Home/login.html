<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queenture</title>

    <link rel="stylesheet" href="../Style/style.css">
    <link rel="stylesheet" href="../Style/login.css">
    <link rel="icon" href="../Web_logo_bright.png">

</head>

<body>
    <div class="Bigcontainer">
        <div class="body R C">
            <div class="container">
                <div class="location"></div>
                <div class="content">
                    <img src="../Images/sofa-gold.jpg" alt="image">

                    <div class="logindata R Col">
                        <div class="R Col">
                            <span class="title"> Log in to QUEENTURE</span>
                            <span class="small">Enter you details below</span>
                        </div>

                        <form class="R Col">
                            <div class="input">
                                <input class="underline" type="text" placeholder="Email or phone number" name="email">
                                <span class="err">Email Or Phone Is Wrong</span>
                            </div>
                            <div class="input">
                                <input class="underline" type="password" placeholder="Password" name="password">
                                <span class="err">Password Is Invalid</span>
                            </div>
                            <div class="R C">
                                <input type="submit" value="Log in">
                                <span>Forget password?</span>
                            </div>
                        </form>
                        <div class="sign R">
                            <span>Don't have an account?</span>
                            <a href="./signup.html">sign up</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../Script/JS/StateAuch.js"></script>
    <script src="../Script/JS/DB.js"></script>
    <script src="../Script/JS/layout.js"></script>
    <script src="../Script/JS/login.js"></script>
</body>

</html>
