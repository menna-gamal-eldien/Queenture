<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="BTN">Click Me</button>
    <script>
        function ClickMe() { console.log("hi") };
        let BTNbuffer = buffer();
        BTN.onclick = _ => BTNbuffer(1000);

        function buffer() {
            let time = new Date().getTime();
            return (delay) => {
                let count = new Date().getTime();
                if (count - time > delay) {
                    time = count;
                    console.log("Done");
                }
            };
        }
    </script>
</body>

</html>
